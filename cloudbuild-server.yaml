steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.server
      - -t
      - asia-east1-docker.pkg.dev/ezpagesite/meetcopilot/server:latest
      - .
images:
  - asia-east1-docker.pkg.dev/ezpagesite/meetcopilot/server:latest
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
